<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>LyricGlass pairing</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span class="mark">≋</span><div><h1>LyricGlass</h1><p>Your browser, in rhythm.</p></div></header>
<p id="status" role="status">Loading connection…</p>
<label>Pairing details from desktop<textarea id="details" rows="3" autocomplete="off" spellcheck="false" placeholder="Paste copied pairing JSON"></textarea></label>
<label>Loopback port<input id="port" type="number" min="1024" max="65535" value="43821"></label>
<button id="pair">Pair with desktop</button><button id="retry" class="secondary">Reconnect</button>
<hr><button id="pin" class="secondary">Use this YouTube tab</button><button id="unpin" class="secondary">Automatic tab selection</button><p id="pinStatus"></p>
<p class="muted">Start the desktop app first. Pairing is stored only in trusted extension storage. Allow local-network access if your browser asks. No YouTube playback is modified.</p>
<script src="popup.js"></script></body></html>
